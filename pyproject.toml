[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "k8s-doctor"
version = "0.1.0"
description = "Audit Kubernetes manifests in a GitHub repository"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "requests>=2.31",
    "anthropic>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
k8s-doctor = "k8s_doctor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
